[project]
name = "auto-paper"
version = "0.1.0"
description = "Daily arXiv paper collection, summarization, and Zotero sync."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
auto-paper = "auto_paper.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
